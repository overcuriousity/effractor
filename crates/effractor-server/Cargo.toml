[package]
name = "effractor-server"
description = "The effractor binary: app shell, embedded assets, share API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "effractor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
askama = "0.16"
effractor-accounts = { path = "../effractor-accounts" }
# `Storage` is used as a trait object, which async fns in traits cannot be yet.
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
# The operating system's randomness, for share ids and delete tokens.
getrandom = "0.3"
mime_guess = "2"
# WebAuthn needs OpenSSL; vendored, so the static musl builds stay static and
# no system library is linked. Building it needs perl, make and a C compiler.
openssl = { version = "0.10", features = ["vendored"] }
# OIDC login against the operator's own issuer; rustls only, no system TLS.
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Asks for a password on the terminal without echoing it (`effractor user`).
rpassword = "7"
# The whole app ships inside the binary: no asset directory to deploy, and no
# third-party origin to fetch from.
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webauthn-rs = { version = "0.5", features = ["conditional-ui"] }
# For ResidentKeyRequirement, which webauthn-rs does not re-export.
webauthn-rs-proto = "0.5"

[dev-dependencies]
chrono = "0.4"
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# A software authenticator that answers usernameless requests, for the tests.
passkey = "0.5"
url = "2"

[lints]
workspace = true
