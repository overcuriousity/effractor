[package]
name = "effractor-server"
description = "The effractor binary: app shell, embedded assets, share API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "effractor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
askama = "0.16"
effractor-accounts = { path = "../effractor-accounts" }
# `Storage` is used as a trait object, which async fns in traits cannot be yet.
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
# The operating system's randomness, for share ids and delete tokens.
getrandom = "0.3"
mime_guess = "2"
# Asks for a password on the terminal without echoing it (`effractor user`).
rpassword = "7"
# The whole app ships inside the binary: no asset directory to deploy, and no
# third-party origin to fetch from.
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
