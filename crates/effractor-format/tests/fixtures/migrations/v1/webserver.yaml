# The course's reference tree, as a person would write it: comments, keys in
# any order, quotes where none are needed, defaults left out.
effractor: 1
name: "Web server unavailable"
profile: fault-tree
top: loss-of-availability
horizon: 8760.0

nodes:
  loss-of-availability:
    gate: or
    label: Loss of availability
    children:
      - no-access
      - no-function
    consequences:
      - asset: webserver
        dim: a
        fraction: 1
  no-access:
    label: Server unreachable
    gate: or
    children: [administration, network, server-outage]
  no-function:
    label: Server not working
    gate: or
    children: [hardware, software, malware, server-outage]   # repeated event
  administration: {label: Administration error, leaf: basic, rate: 0.0000007}
  network:
    label: Network outage
    leaf: basic
    rate: 3.5e-7
  server-outage:
    label: Server outage
    leaf: basic
    rate: 2.5e-6
  hardware:
    label: Hardware defect
    rate: 1.3e-6
    leaf: basic
  software:
    label: 'Software fault'
    leaf: basic
    rate: 2.3e-7
  malware:
    label: Malware
    leaf: undeveloped
    p: 0.004

assets:
  webserver:
    label: Web server
    loss: {c: 20000, i: 40000, a: "Pert(60000, 120000, 400000)"}

controls:
  redundant-psu:
    label: Redundant power supply
    cost: 1800
    enabled: false
    effects:
      - {node: hardware, ttc: Exponential(4e-7)}
