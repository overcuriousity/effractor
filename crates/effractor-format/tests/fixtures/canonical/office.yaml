effractor: 1
profile: attack-tree
name: "Büro: Zugriff auf den Fileserver"
time_unit: d
horizon: 30
currency: EUR
top: fileserver

nodes:
  fileserver:
    label: Daten vom Fileserver lesen
    description: "Zwei Wege: über ein Konto oder physisch.\nDer physische Weg braucht zwei von drei Schritten."
    gate: or
    children: [konto, physisch]
    consequences:
      - {asset: akten, dim: c}
      - {asset: akten, dim: i, fraction: 0.25}
  konto:
    label: Konto übernehmen
    gate: and
    children: [phishing, mfa-umgehen]
  physisch:
    label: Physischer Zugriff
    gate: vote
    k: 2
    children: [schluessel, alarm-aus, innentaeter]
    x-source: {ref: Begehung 2026-03, pages: [4, 5]}
  phishing:
    label: Phishing
    leaf: basic
    ttc: "HardAndUncertain"
    cost: 200
    detection: 0.3
  mfa-umgehen:
    label: MFA umgehen (Push-Müdigkeit)
    leaf: basic
    ttc: "Bernoulli(0.2) * LogNormal(1.5, 0.8)"
    cost: 50
    detection: 0.6
  schluessel:
    label: "true"
    leaf: basic
    p: 0.1
    cost: 1500
    detection: 0.05
  alarm-aus:
    label: Alarmanlage ausgeschaltet
    leaf: undeveloped
  innentaeter:
    label: Innentäter
    leaf: undeveloped
    ttc: "Gamma(2, 10)"
    cost: 10000
    detection: 0.5

assets:
  akten:
    label: Personalakten
    description: Alles, was unter die DSGVO fällt.
    loss: {c: "Pert(5000, 40000, 2000000)", i: 15000, x-note: FAIR-Workshop}

controls:
  schulung:
    label: Phishing-Schulung
    cost: 2500
    enabled: true
    effects:
      - {node: phishing, ttc: "VeryHardAndUncertain"}
      - {node: innentaeter, ttc: "Infinity", x-why: [Vier-Augen-Prinzip]}

analysis:
  seed: 7
  samples: 50000
  confidence: 0.9
  x-last-run: 2026-09-01

x-owner: IT-Sicherheit
x-tags: [kurs, "beispiel, mit komma"]
