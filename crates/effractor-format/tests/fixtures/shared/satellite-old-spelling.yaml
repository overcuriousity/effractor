effractor: 1
profile: fault-tree
name: Earth observation satellite loses its downlink
time_unit: d
horizon: 180
currency: EUR
top: mission-data-lost

nodes:
  mission-data-lost:
    label: Mission cannot deliver observation data
    description: A six-month mission with persistent failures and no credited repair. Gamma and truncated-normal distributions illustrate nonconstant hazards. Every failure clock starts at mission start, including backup hardware; this is not a model of dormant spares or sequential switchover timing.
    gate: or
    children: [space-segment-lost, ground-segment-lost, pointing-lost]
    consequences:
      - {asset: imagery-service, dim: a}
  space-segment-lost:
    label: Spacecraft cannot transmit
    gate: or
    children: [both-radios-lost, antenna-deployment, power-lost]
  both-radios-lost:
    label: Both transmitter chains fail
    gate: and
    children: [radio-a-lost, radio-b-lost]
  radio-a-lost:
    label: Transmitter A unavailable
    gate: or
    children: [amplifier-a, radiation-damage]
  radio-b-lost:
    label: Transmitter B unavailable
    gate: or
    children: [amplifier-b, radiation-damage]
  amplifier-a:
    label: Power amplifier A fails
    leaf: basic
    ttc: "Gamma(2, 900)"
  amplifier-b:
    label: Power amplifier B fails
    leaf: basic
    ttc: "Gamma(2, 1100)"
  radiation-damage:
    label: Common radiation event disables both radios
    leaf: undeveloped
    ttc: "Bernoulli(0.08) * Exponential(0.004)"
    consequences:
      - {asset: spacecraft, dim: a, fraction: 0.4}
  antenna-deployment:
    label: Antenna does not deploy at mission start
    leaf: basic
    p: 0.008
  power-lost:
    label: Electrical power is insufficient for downlink
    gate: or
    children: [array-loss, battery-degradation, power-controller]
    consequences:
      - {asset: spacecraft, dim: a}
  array-loss:
    label: Solar array suffers an unrecoverable failure
    leaf: basic
    rate: 8e-5
  battery-degradation:
    label: Battery capacity crosses the mission threshold
    leaf: basic
    ttc: "TruncatedNormal(650, 180)"
  power-controller:
    label: Common power controller fails
    leaf: basic
    rate: 2.5e-5
  ground-segment-lost:
    label: Neither contracted ground station can support the mission
    gate: and
    children: [station-a-lost, station-b-lost]
  station-a-lost:
    label: Ground station A permanently unavailable
    gate: or
    children: [station-a-hardware, shared-scheduling-service]
  station-b-lost:
    label: Ground station B permanently unavailable
    gate: or
    children: [station-b-hardware, shared-scheduling-service]
  station-a-hardware:
    label: Station A loses its antenna system
    leaf: basic
    rate: 6e-5
  station-b-hardware:
    label: Station B loses its antenna system
    leaf: basic
    rate: 5e-5
  shared-scheduling-service:
    label: Common scheduling service is withdrawn
    leaf: undeveloped
    ttc: "Bernoulli(0.025) * Exponential(0.01)"
  pointing-lost:
    label: Spacecraft can no longer point the antenna
    gate: or
    children: [wheel-capacity-lost, attitude-computer]
  wheel-capacity-lost:
    label: At least two of four reaction wheels fail
    description: Three functioning wheels are assumed sufficient for this mission.
    gate: vote
    k: 2
    children: [wheel-a, wheel-b, wheel-c, wheel-d]
  wheel-a:
    label: Reaction wheel A fails
    leaf: basic
    ttc: "Gamma(2, 600)"
  wheel-b:
    label: Reaction wheel B fails
    leaf: basic
    ttc: "Gamma(2, 600)"
  wheel-c:
    label: Reaction wheel C fails
    leaf: basic
    ttc: "Gamma(2, 600)"
  wheel-d:
    label: Reaction wheel D fails
    leaf: basic
    ttc: "Gamma(2, 600)"
  attitude-computer:
    label: Attitude computer fails permanently
    leaf: basic
    rate: 3e-5

assets:
  imagery-service:
    label: Undelivered imagery contracts
    loss: {a: "Pert(200000, 900000, 3000000)"}
  spacecraft:
    label: Lost spacecraft capability
    description: Capital loss only; imagery contract losses are counted separately.
    loss: {a: 4500000}

controls:
  radiation-hardening:
    label: Harden the radio subsystem against radiation
    cost: 65000
    enabled: false
    effects:
      - {node: radiation-damage, ttc: "Bernoulli(0.015) * Exponential(0.004)"}
  independent-scheduling:
    label: Independent ground-station scheduling contracts
    cost: 18000
    enabled: false
    effects:
      - {node: shared-scheduling-service, ttc: "Bernoulli(0.003) * Exponential(0.01)"}
  battery-screening:
    label: Screen batteries before launch
    cost: 12000
    enabled: true
    effects:
      - {node: battery-degradation, ttc: "TruncatedNormal(850, 150)"}

analysis:
  seed: 105
  samples: 10000
  confidence: 0.95
