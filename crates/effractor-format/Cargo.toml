[package]
name = "effractor-format"
description = "YAML document format: load, canonical save, migrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
effractor-core = { path = "../effractor-core" }
effractor-mal = { path = "../effractor-mal" }
indexmap = "2"
# An event parser with source spans and nothing else: no serde, no I/O, no_std.
# The format needs positions for diagnostics and says no to most of YAML, so it
# reads events itself rather than accept a library's idea of a document.
saphyr-parser = "0.1.0"
# The document's JSON image, which is what the browser edits. `preserve_order`
# because the order of a map is the author's here, in JSON as in YAML.
serde_json = { version = "1.0.151", features = ["preserve_order"] }

[lints]
workspace = true

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
