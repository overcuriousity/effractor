id: effractor-login
info:
  name: Where someone logs in
  author: effractor
  severity: info
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    host-redirects: true
    max-redirects: 3
    extractors:
      - type: regex
        name: login
        part: body
        regex:
          - >-
            (?i)<input[^>]*type=["]?password
      - type: regex
        name: sso-keycloak
        part: header
        group: 1
        regex:
          - "(?i)location:[[:space:]]*(https?://[^[:space:]]*/realms/[^/[:space:]]+/protocol/(?:openid-connect|saml)[^[:space:]]*)"
      - type: regex
        name: sso-adfs
        part: header
        group: 1
        regex:
          - "(?i)location:[[:space:]]*(https?://[^[:space:]]*/adfs/(?:ls|oauth2)[^[:space:]]*)"
      - type: regex
        name: sso-entra
        part: header
        group: 1
        regex:
          - "(?i)location:[[:space:]]*(https?://[^[:space:]]*login[.]microsoftonline[.]com[^[:space:]]*)"
      - type: regex
        name: sso-okta
        part: header
        group: 1
        regex:
          - "(?i)location:[[:space:]]*(https?://[^[:space:]]*[.]okta[.]com[^[:space:]]*)"
      - type: regex
        name: sso-google
        part: header
        group: 1
        regex:
          - "(?i)location:[[:space:]]*(https?://[^[:space:]]*accounts[.]google[.]com[^[:space:]]*)"
      - type: regex
        name: sso-saml
        part: header
        group: 1
        regex:
          - "(?i)location:[[:space:]]*(https?://[^[:space:]]*[?&]SAMLRequest=[^[:space:]]*)"
      - type: regex
        name: sso-oidc
        part: header
        group: 1
        regex:
          - "(?i)location:[[:space:]]*(https?://[^[:space:]]*[?&]response_type=[^[:space:]]*client_id=|[?&]client_id=[^[:space:]]*response_type=[^[:space:]]*)"
      - type: regex
        name: sso-keycloak-link
        part: body
        group: 1
        regex:
          - >-
            (?i)(?:href|action)="(https?://[^"[:space:]]*/realms/[^/"[:space:]]+/protocol/(?:openid-connect|saml)[^"[:space:]]*)"
      - type: regex
        name: sso-adfs-link
        part: body
        group: 1
        regex:
          - >-
            (?i)(?:href|action)="(https?://[^"[:space:]]*/adfs/(?:ls|oauth2)[^"[:space:]]*)"
      - type: regex
        name: sso-entra-link
        part: body
        group: 1
        regex:
          - >-
            (?i)(?:href|action)="(https?://[^"[:space:]]*login[.]microsoftonline[.]com[^"[:space:]]*)"
      - type: regex
        name: sso-okta-link
        part: body
        group: 1
        regex:
          - >-
            (?i)(?:href|action)="(https?://[^"[:space:]]*[.]okta[.]com[^"[:space:]]*)"
      - type: regex
        name: sso-google-link
        part: body
        group: 1
        regex:
          - >-
            (?i)(?:href|action)="(https?://[^"[:space:]]*accounts[.]google[.]com[^"[:space:]]*)"
