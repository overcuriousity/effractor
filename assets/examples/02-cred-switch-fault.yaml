effractor: 2
profile: fault-tree
name: Kestrel Clearing's cred switch cannot authorise payments
time_unit: h
horizon: 720
currency: EUR
top: authorisation-down

nodes:
  authorisation-down:
    label: Cred-chip payments cannot be authorised for a month-long stretch
    description: Kestrel Clearing runs the cred switch behind half the chip readers on the Glass Mile; this is one 30-day month, no repair credited. Authorisation needs the switch cluster, a working signing path through the hardware security modules, and a way out to the clearing networks. The three HSMs vote two-of-three; both clearing links share one carrier's harbour ring and one name-service provider, which are modelled as shared events rather than copied. Illustrative inputs, not an operator's incident history.
    gate: or
    children:
      - switch-cluster-down
      - signing-lost
      - clearing-unreachable
      - bad-config-push
    consequences:
      - {asset: clearing-revenue, dim: a}
      - {asset: customer-trust, dim: a}
  switch-cluster-down:
    label: Both switch nodes are down
    gate: and
    children: [switch-node-a, switch-node-b]
  switch-node-a:
    label: Switch node A (Glass Mile vault floor) fails
    gate: or
    children: [node-a-hardware, shared-kernel-bug]
  switch-node-b:
    label: Switch node B (Docks bunker) fails
    gate: or
    children: [node-b-hardware, shared-kernel-bug]
  node-a-hardware:
    label: Node A hardware fault
    leaf: basic
    rate: 6e-5
  node-b-hardware:
    label: Node B hardware fault
    leaf: basic
    rate: 6e-5
  shared-kernel-bug:
    label: A kernel regression in the common OS image crashes both nodes
    description: One event shared by both nodes; the same image runs everywhere.
    leaf: undeveloped
    ttc: "2% * Exponential(mean 300)"
  signing-lost:
    label: Fewer than two HSMs can sign
    description: The switch needs two of three HSMs for key quorum, so two failures stop signing.
    gate: vote
    k: 2
    children: [hsm-1, hsm-2, hsm-3]
  hsm-1:
    label: HSM 1 fails or zeroises itself on a tamper alarm
    leaf: basic
    rate: 5e-5
  hsm-2:
    label: HSM 2 fails or zeroises itself on a tamper alarm
    leaf: basic
    rate: 5e-5
  hsm-3:
    label: HSM 3 fails or zeroises itself on a tamper alarm
    leaf: basic
    rate: 5e-5
  clearing-unreachable:
    label: Neither clearing network can be reached
    gate: or
    children: [both-links-down, name-service-outage]
  both-links-down:
    label: Both clearing links are down
    gate: and
    children: [link-primary, link-secondary]
  link-primary:
    label: Primary clearing link fails
    gate: or
    children: [primary-circuit, harbour-ring-cut]
  link-secondary:
    label: Secondary clearing link fails
    gate: or
    children: [secondary-circuit, harbour-ring-cut]
  primary-circuit:
    label: Primary leased circuit fails
    leaf: basic
    rate: 0.0001
  secondary-circuit:
    label: Secondary leased circuit fails
    leaf: basic
    rate: 0.0001
  harbour-ring-cut:
    label: The one carrier harbour ring both circuits ride on is cut
    description: Diverse on the contract, not in the duct under the Docks.
    leaf: basic
    rate: 2e-5
  name-service-outage:
    label: Managed name-service outage hides the clearing endpoints
    leaf: undeveloped
    ttc: "1.5% * LogNormal(2.5, 0.8)"
  bad-config-push:
    label: A faulty routing config reaches production
    gate: and
    children: [config-error, canary-misses]
  config-error:
    label: An engineer ships a wrong routing table
    leaf: basic
    rate: 0.0008
  canary-misses:
    label: The canary stage does not catch it
    leaf: basic
    p: 0.1

assets:
  clearing-revenue:
    label: Clearing fees lost while chips decline
    loss: {a: "Pert(150000, 400000, 2500000)"}
  customer-trust:
    label: Merchants leaving after a public outage
    description: Churn and the Glass Mile regulator's attention; counted separately from fees.
    loss: {a: "LogNormal(12.5, 0.9)"}

controls:
  diverse-carrier:
    label: Move the secondary link to a second carrier with its own duct
    cost: 6000
    enabled: false
    effects:
      - {node: harbour-ring-cut, ttc: "Exponential(mean 400000)"}
  secondary-name-service:
    label: Second name-service provider with pinned clearing endpoints
    cost: 1200
    enabled: false
    effects:
      - {node: name-service-outage, ttc: "0.1% * LogNormal(2.5, 0.8)"}
  staged-os-rollout:
    label: Roll the OS image out one node at a time, a week apart
    cost: 3500
    enabled: false
    effects:
      - {node: shared-kernel-bug, ttc: "0.5% * Exponential(mean 300)"}
  two-person-config:
    label: Second-engineer review for routing changes
    cost: 2500
    enabled: true
    effects:
      - {node: config-error, ttc: "Exponential(mean 5000)"}

analysis:
  seed: 102
  samples: 10000
  confidence: 0.95
