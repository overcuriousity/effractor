# Fictional training model; probabilities and EUR losses are illustrative.
effractor: 1
profile: fault-tree
name: Cold room loses temperature control
time_unit: h
horizon: 168
currency: EUR
top: temperature-excursion

nodes:
  temperature-excursion:
    label: Stock exceeds its temperature limit
    description: >-
      One week of unattended storage. Each basic event means an excursion long
      enough to spoil stock, not a momentary alarm. Static probabilities apply
      to this week and do not scale automatically when the horizon changes.
    gate: or
    children: [extended-power-loss, cooling-failure, door-left-open]
    consequences:
      - {asset: chilled-stock, dim: a}
  extended-power-loss:
    label: Power loss exceeds thermal holdover
    leaf: basic
    p: 0.012
  cooling-failure:
    label: Refrigeration stops without a timely alarm
    gate: and
    children: [refrigeration-failed, alarm-response-failed]
  refrigeration-failed:
    label: Refrigeration unit fails
    leaf: basic
    p: 0.025
  alarm-response-failed:
    label: Alarm does not trigger intervention
    leaf: basic
    p: 0.15
  door-left-open:
    label: Loading door remains open overnight
    leaf: undeveloped
    p: 0.008

assets:
  chilled-stock:
    label: Perishable stock
    loss: {a: 24000}

controls:
  independent-alarm:
    label: Independent alarm with an on-call rota
    description: Weekly service cost; reduces missed intervention, not equipment failure.
    cost: 90
    enabled: false
    effects:
      - {node: alarm-response-failed, ttc: "2.5%"}
  door-closer:
    label: Self-closing loading door
    cost: 35
    enabled: true
    effects:
      - {node: door-left-open, ttc: "0.1%"}

analysis: {seed: 101, samples: 10000, confidence: 0.95}
