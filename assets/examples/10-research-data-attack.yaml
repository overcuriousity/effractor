# Fictional training model; no real institution or calibrated threat data.
effractor: 1
profile: attack-tree
name: Unpublished research data disclosed
time_unit: d
horizon: 180
currency: EUR
top: research-disclosed

nodes:
  research-disclosed:
    label: Obtain unpublished research data
    description: >-
      A university consortium stores data in a collaboration portal, an analysis
      cluster and an offline archive. A shared identity compromise unlocks two
      alternatives but is sampled and costed once. All leaf clocks run in
      parallel. Pareto objectives expose cheap/noisy and expensive/quiet routes.
    gate: or
    children: [portal-export, cluster-copy, archive-theft]
    consequences:
      - {asset: research-dataset, dim: c}
  portal-export:
    label: Read data through the collaboration portal
    gate: and
    children: [researcher-identity, portal-permission, export-boundary]
  cluster-copy:
    label: Read data from the analysis cluster
    gate: and
    children: [cluster-access, dataset-permission, export-boundary]
  researcher-identity:
    label: Control a participating researcher's identity
    gate: or
    children: [researcher-session, collaborator-account]
  researcher-session:
    label: Obtain a researcher's authenticated session
    leaf: basic
    ttc: "45% * LogNormal(3, 0.8)"
    cost: 2500
    detection: 0.35
  collaborator-account:
    label: Obtain an external collaborator account
    leaf: undeveloped
    ttc: "30% * Pareto(12, 1.8)"
    cost: 7000
    detection: 0.08
  portal-permission:
    label: Gain a project-wide portal read grant
    leaf: basic
    ttc: "60% * Exponential(mean 40)"
    cost: 1000
    detection: 0.12
  export-boundary:
    label: Move a usable dataset past export restrictions
    leaf: basic
    ttc: "70% * Gamma(2, 12)"
    cost: 3000
    detection: 0.5
  cluster-access:
    label: Establish access to the analysis environment
    gate: or
    children: [researcher-identity, compute-service-account]
  compute-service-account:
    label: Obtain the cluster automation identity
    leaf: basic
    ttc: "20% * Gamma(3, 18)"
    cost: 11000
    detection: 0.15
  dataset-permission:
    label: Obtain permission to read the protected dataset
    leaf: basic
    ttc: "50% * LogNormal(3.4, 0.6)"
    cost: 1800
    detection: 0.2
  archive-theft:
    label: Recover the dataset from an offline archive
    gate: and
    children: [archive-media, archive-key, archive-catalog]
    consequences:
      - {asset: archive-service, dim: a, fraction: 0.5}
  archive-media:
    label: Obtain a readable copy of archive media
    leaf: basic
    ttc: "25% * TruncatedNormal(70, 25)"
    cost: 18000
    detection: 0.06
  archive-key:
    label: Obtain the archive decryption material
    leaf: basic
    ttc: "15% * Gamma(3, 25)"
    cost: 14000
    detection: 0.05
  archive-catalog:
    label: Identify the relevant archive objects
    leaf: basic
    ttc: "Exponential(mean 33.3)"
    cost: 2000
    detection: 0.02

assets:
  research-dataset:
    label: Unpublished research and contractual exposure
    loss: {c: "Pert(100000, 750000, 4000000)"}
  archive-service:
    label: Archive reconstruction effort
    loss: {a: 90000}

controls:
  session-protection:
    label: Device-bound researcher sessions
    cost: 8500
    enabled: false
    effects:
      - {node: researcher-session, ttc: "12% * LogNormal(3.7, 0.8)"}
  collaborator-review:
    label: Review external collaborator access
    cost: 4200
    enabled: true
    effects:
      - {node: collaborator-account, ttc: "8% * Pareto(25, 1.8)"}
  export-approval:
    label: Enforce independent bulk-export approval
    cost: 12000
    enabled: false
    effects:
      - {node: export-boundary, ttc: "15% * Gamma(2, 25)"}
  archive-key-separation:
    label: Separate archive media and key custodians
    cost: 6000
    enabled: false
    effects:
      - {node: archive-key, ttc: "2.5% * Gamma(3, 40)"}

analysis: {seed: 110, samples: 10000, confidence: 0.95}
