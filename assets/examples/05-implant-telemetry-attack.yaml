effractor: 2
profile: attack-tree
name: Neural-implant telemetry disclosed
time_unit: d
horizon: 90
currency: EUR
top: telemetry-disclosed

nodes:
  telemetry-disclosed:
    label: Obtain a bulk copy of patients' implant telemetry
    description: A neurotech clinic streams telemetry from deep-brain-stimulation implants into a clinician portal and an analytics warehouse; the implant vendor keeps a remote-support path into the clinic. A data broker wants the dataset within a quarter. A clinician identity is shared by the portal and the warehouse routes and is sampled and paid for once. The vendor route needs two of three footholds. Costs are the broker's in EUR; detection is the chance the clinic's security team notices. Illustrative inputs.
    gate: or
    children: [portal-route, warehouse-route, vendor-route]
    consequences:
      - {asset: patient-telemetry, dim: c}
      - {asset: clinic-operations, dim: a, fraction: 0.3}
  portal-route:
    label: Export the dataset through the clinician portal
    gate: and
    children: [clinician-identity, portal-bulk-export]
  warehouse-route:
    label: Query the analytics warehouse directly
    gate: and
    children: [warehouse-access, research-grant, egress-past-dlp]
  clinician-identity:
    label: Control a clinician's identity
    gate: or
    children: [clinician-session, locum-account]
  clinician-session:
    label: Obtain a clinician's authenticated session
    leaf: basic
    ttc: "40% * LogNormal(2.5, 0.8)"
    cost: 3000
    detection: 0.3
  locum-account:
    label: Obtain a stale account of a former locum doctor
    leaf: undeveloped
    ttc: "20% * Exponential(mean 25)"
    cost: 1500
    detection: 0.05
  portal-bulk-export:
    label: Get the portal to export more than one patient at a time
    leaf: basic
    ttc: "30% * Gamma(2, 10)"
    cost: 2000
    detection: 0.55
  warehouse-access:
    label: Reach the warehouse's query interface
    gate: or
    children: [clinician-identity, etl-service-account]
  etl-service-account:
    label: Obtain the ETL pipeline's service credentials
    leaf: basic
    ttc: "25% * Gamma(3, 12)"
    cost: 9000
    detection: 0.1
  research-grant:
    label: Hold a research-cohort grant on the telemetry tables
    leaf: basic
    ttc: "45% * Exponential(mean 20)"
    cost: 1200
    detection: 0.15
  egress-past-dlp:
    label: Move the result set out past data-loss prevention
    leaf: basic
    ttc: "60% * Gamma(2, 6)"
    cost: 2500
    detection: 0.35
  vendor-route:
    label: Come in over the vendor's remote-support path
    description: Any two of the three are enough to reach the telemetry collector.
    gate: vote
    k: 2
    children: [vendor-vpn-account, support-jump-host, open-support-window]
  vendor-vpn-account:
    label: Control a vendor field engineer's VPN account
    leaf: basic
    ttc: "20% * Exponential(mean 30)"
    cost: 6000
    detection: 0.1
  support-jump-host:
    label: Control the vendor's support jump host
    leaf: undeveloped
    ttc: "10% * Pareto(20, 1.6)"
    cost: 25000
    detection: 0.05
  open-support-window:
    label: Find a remote-support window left open after maintenance
    leaf: basic
    ttc: "35% * Exponential(mean 15)"
    cost: 500
    detection: 0.2

assets:
  patient-telemetry:
    label: Implant telemetry of 4,200 patients
    description: Notification, regulator fines and litigation; health data under GDPR Art. 9.
    loss: {c: "Pert(400000, 2500000, 15000000)"}
  clinic-operations:
    label: Clinic downtime during forensic investigation
    loss: {a: 350000}

controls:
  phishing-resistant-login:
    label: Hardware security keys for clinicians
    cost: 18000
    enabled: false
    effects:
      - {node: clinician-session, ttc: "8% * LogNormal(3.2, 0.8)"}
  joiner-leaver:
    label: Disable locum accounts on the last day of their contract
    cost: 3000
    enabled: false
    effects:
      - {node: locum-account, ttc: "2% * Exponential(mean 25)"}
  export-four-eyes:
    label: Two-person approval for exports of more than ten patients
    cost: 7000
    enabled: true
    effects:
      - {node: portal-bulk-export, ttc: "10% * Gamma(2, 20)"}
  vendor-session-broker:
    label: Vendor sessions only through a recorded broker, opened on request
    cost: 22000
    enabled: false
    effects:
      - {node: open-support-window, ttc: "3% * Exponential(mean 15)"}
      - {node: vendor-vpn-account, ttc: "8% * Exponential(mean 45)"}

analysis:
  seed: 105
  samples: 10000
  confidence: 0.95
