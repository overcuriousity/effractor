# Fictional training model; per-batch probabilities and EUR losses are illustrative.
effractor: 1
profile: fault-tree
name: A packaged food batch leaves the plant out of specification
time_unit: h
horizon: 8
currency: EUR
top: nonconforming-batch-released

nodes:
  nonconforming-batch-released:
    label: Out-of-specification batch is released
    description: >-
      One eight-hour production batch. Branches combine a defect with failure
      of the relevant release barrier. Shared sanitation and release-system
      failures are single events. Independent residual leaves are assumed.
      Financial losses cover recall, rework and downtime only.
    gate: or
    children: [microbial-release, foreign-body-release, label-release]
    consequences:
      - {asset: recall-response, dim: a}
  microbial-release:
    label: Contaminated batch passes release
    gate: and
    children: [microbial-defect, microbiology-barrier-failed]
    consequences:
      - {asset: finished-goods, dim: i}
      - {asset: line-capacity, dim: a, fraction: 0.8}
  microbial-defect:
    label: Microbial contamination remains in the batch
    gate: or
    children: [incoming-contamination, process-treatment-failed, postprocess-contamination]
  incoming-contamination:
    label: Incoming ingredient contamination exceeds process capability
    leaf: undeveloped
    p: 0.009
  process-treatment-failed:
    label: Treatment fails and its interlock does not stop the batch
    gate: and
    children: [temperature-low, temperature-interlock-failed]
  temperature-low:
    label: Treatment temperature is insufficient
    leaf: basic
    p: 0.018
  temperature-interlock-failed:
    label: Temperature interlock fails to stop the batch
    leaf: basic
    p: 0.025
  postprocess-contamination:
    label: Product is contaminated during filling
    gate: or
    children: [sanitation-failed, seal-handling-error]
  sanitation-failed:
    label: Cleaning and sanitation fail for this batch
    description: One event shared by the microbial and foreign-material branches.
    leaf: basic
    p: 0.012
  seal-handling-error:
    label: Filling or sealing introduces contamination
    leaf: basic
    p: 0.006
  microbiology-barrier-failed:
    label: Contamination is not stopped by batch release
    gate: or
    children: [sample-misses-contamination, release-system-bypassed]
  sample-misses-contamination:
    label: Sampling fails to identify a contaminated batch
    leaf: basic
    p: 0.12
  release-system-bypassed:
    label: Batch release checks are bypassed
    leaf: basic
    p: 0.004
  foreign-body-release:
    label: Batch with foreign material passes release
    gate: and
    children: [foreign-material-present, foreign-material-barrier-failed]
    consequences:
      - {asset: finished-goods, dim: i, fraction: 0.6}
      - {asset: line-capacity, dim: a, fraction: 0.3}
  foreign-material-present:
    label: Foreign material enters product
    gate: or
    children: [sanitation-failed, equipment-wear, packaging-fragment]
  equipment-wear:
    label: Worn equipment sheds material
    leaf: basic
    p: 0.01
  packaging-fragment:
    label: Packaging fragment enters product
    leaf: basic
    p: 0.007
  foreign-material-barrier-failed:
    label: Foreign material detection or release fails
    gate: or
    children: [detector-misses, reject-mechanism-failed, release-system-bypassed]
  detector-misses:
    label: Detection system misses the relevant material
    leaf: basic
    p: 0.08
  reject-mechanism-failed:
    label: Reject mechanism fails to divert affected product
    leaf: basic
    p: 0.02
  label-release:
    label: Incorrect product label passes release
    gate: and
    children: [wrong-label, label-barrier-failed]
    consequences:
      - {asset: finished-goods, dim: i, fraction: 0.4}
  wrong-label:
    label: Packaging carries the wrong product information
    gate: or
    children: [artwork-error, reel-mixup]
  artwork-error:
    label: Approved artwork contains an error
    leaf: undeveloped
    p: 0.003
  reel-mixup:
    label: Operator loads the wrong label reel
    leaf: basic
    p: 0.009
  label-barrier-failed:
    label: Label verification does not stop release
    gate: or
    children: [vision-check-failed, release-system-bypassed]
  vision-check-failed:
    label: Vision system accepts the wrong label
    leaf: basic
    p: 0.04

assets:
  recall-response:
    label: Recall coordination and logistics
    loss: {a: "Pert(20000, 90000, 600000)"}
  finished-goods:
    label: Batch disposal or rework
    description: Multiple defects take the largest affected fraction, not a sum.
    loss: {i: 65000}
  line-capacity:
    label: Investigation and cleaning downtime
    loss: {a: "Pert(8000, 24000, 80000)"}

controls:
  sanitation-verification:
    label: Independently verify each sanitation cycle
    cost: 180
    enabled: false
    effects:
      - {node: sanitation-failed, ttc: "0.2%"}
  release-interlock:
    label: Enforce electronic batch-release checks
    cost: 120
    enabled: false
    effects:
      - {node: release-system-bypassed, ttc: "0.05%"}
  reject-proof-test:
    label: Proof-test detection and rejection before each batch
    cost: 75
    enabled: true
    effects:
      - {node: detector-misses, ttc: "3%"}
      - {node: reject-mechanism-failed, ttc: "0.4%"}
  label-verification:
    label: Independent artwork and reel verification
    cost: 95
    enabled: false
    effects:
      - {node: artwork-error, ttc: "0.06%"}
      - {node: reel-mixup, ttc: "0.2%"}

analysis: {seed: 106, samples: 10000, confidence: 0.95}
