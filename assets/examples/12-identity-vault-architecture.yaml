effractor: 2
profile: architecture
name: Kestrel Clearing identity vault
time_unit: d
horizon: 30
library: {id: core-components, version: 1}

entities:
  street-net:
    kind: network
    label: Street net
  exchange-dmz:
    kind: network
    label: Exchange DMZ
  trading-floor:
    kind: network
    label: Trading-floor network
  vault-net:
    kind: network
    label: Vault network
  exchange-gate:
    kind: router
    label: Exchange gateway
    parameters:
      escape:
        status: unknown
  gate-ice:
    kind: firewall
    label: Gateway ICE
  floor-router:
    kind: router
    label: Floor router
    parameters:
      escape:
        status: unknown
  floor-ice:
    kind: firewall
    label: Floor ICE
  decker-rig:
    kind: host
    label: Decker's rig
    parameters:
      escape:
        status: unknown
  deck-client:
    kind: application
    label: Deck client
    parameters:
      take-over:
        status: unknown
      take-over-guarded:
        status: unknown
    defenses: {guarded: unknown}
  ops-terminal:
    kind: host
    label: Compromised ops terminal
    description: A terminal on the trading floor that a fixer's inside contact already opened to the decker
    parameters:
      escape:
        status: unknown
  db-client:
    kind: application
    label: Database client
    parameters:
      take-over:
        status: unknown
      take-over-guarded:
        status: unknown
    defenses: {guarded: unknown}
  api-node:
    kind: host
    label: API node
    parameters:
      escape:
        status: unknown
  identity-api:
    kind: service
    label: Identity API
    description: The service open to the street net that serves identity dossiers to the compliance app
    parameters:
      deploy-exploit:
        status: illustrative
        ttc: "Exponential(mean 3)"
        note: Teaching input
      login:
        status: illustrative
        ttc: "Exponential(mean 0.3)"
        note: Teaching input
      take-over:
        status: unknown
      take-over-guarded:
        status: unknown
    defenses: {guarded: unknown}
  veritas:
    kind: product
    label: VeritasID Portal 4
    parameters:
      find-exploit:
        status: unknown
      find-exploit-patched:
        status: illustrative
        ttc: "Never"
        note: "Teaching input: the pending vendor patch is taken to close this route"
    defenses: {patched: false}
  vault-node:
    kind: host
    label: Vault database node
    parameters:
      escape:
        status: unknown
  vault-db:
    kind: service
    label: Vault database
    description: The database process on the vault node; it stores the dossiers encrypted
    parameters:
      deploy-exploit:
        status: illustrative
        ttc: "Exponential(mean 6)"
        note: Teaching input
      login:
        status: illustrative
        ttc: "Exponential(mean 0.3)"
        note: Teaching input
      take-over:
        status: unknown
      take-over-guarded:
        status: unknown
    defenses: {guarded: unknown}
  strongroom:
    kind: product
    label: Strongroom DB 9
    parameters:
      find-exploit:
        status: illustrative
        ttc: "Exponential(mean 18)"
        note: Teaching input
      find-exploit-patched:
        status: illustrative
        ttc: "Never"
        note: Teaching input
    defenses: {patched: false}
  hsm:
    kind: host
    label: HSM appliance
    parameters:
      escape:
        status: unknown
  dossier-key:
    kind: credential
    label: Dossier encryption key
    description: The key the dossiers are encrypted with, kept in the HSM
    parameters:
      extract:
        status: illustrative
        ttc: "Exponential(mean 4)"
        note: "Teaching input: an unsealed key the vault node can read from the HSM"
      extract-protected:
        status: illustrative
        ttc: "Never"
        note: "Teaching input: a sealed HSM key that never leaves the appliance"
    defenses: {protected: false}
  identity-dossiers:
    kind: data
    label: Client identity dossiers
    description: Retina scans, implant serials and proof of address for every account holder — the decker's goal
    defenses: {encrypted: false}

associations:
  rig-on-street-net:
    kind: attached
    from: decker-rig
    to: street-net
  gate-on-street-net:
    kind: attached
    from: exchange-gate
    to: street-net
  gate-on-dmz:
    kind: attached
    from: exchange-gate
    to: exchange-dmz
  api-node-on-dmz:
    kind: attached
    from: api-node
    to: exchange-dmz
  floor-router-on-dmz:
    kind: attached
    from: floor-router
    to: exchange-dmz
  floor-router-on-floor:
    kind: attached
    from: floor-router
    to: trading-floor
  vault-node-on-floor:
    kind: attached
    from: vault-node
    to: trading-floor
  terminal-on-floor:
    kind: attached
    from: ops-terminal
    to: trading-floor
  vault-node-on-vault-net:
    kind: attached
    from: vault-node
    to: vault-net
  hsm-on-vault-net:
    kind: attached
    from: hsm
    to: vault-net
  gate-filters:
    kind: filters
    from: exchange-gate
    to: gate-ice
  floor-filters:
    kind: filters
    from: floor-router
    to: floor-ice
  rig-runs-client:
    kind: hosts
    from: decker-rig
    to: deck-client
    privilege: user
  terminal-runs-client:
    kind: hosts
    from: ops-terminal
    to: db-client
    privilege: user
  api-node-runs-api:
    kind: hosts
    from: api-node
    to: identity-api
    privilege: admin
  api-is-veritas:
    kind: instance-of
    from: identity-api
    to: veritas
  vault-node-runs-db:
    kind: hosts
    from: vault-node
    to: vault-db
    privilege: admin
  db-is-strongroom:
    kind: instance-of
    from: vault-db
    to: strongroom
  key-store:
    kind: stores
    from: vault-node
    to: dossier-key
    privilege: admin
  dossiers-encrypted-with:
    kind: encrypted-with
    from: identity-dossiers
    to: dossier-key
  api-holds-dossiers:
    kind: holds
    from: identity-api
    to: identity-dossiers
    privilege: user
    decrypts: true
    description: The API serves the dossiers, so it holds plaintext while running
  vault-node-holds-dossiers:
    kind: holds
    from: vault-node
    to: identity-dossiers
    privilege: admin
    decrypts: false
    description: On the vault node the dossiers sit encrypted at rest
  api-to-db-permit:
    kind: permits
    from: floor-ice
    to: api-to-db
    allowed: true
  api-permit:
    kind: permits
    from: gate-ice
    to: reach-api
    allowed: true

flows:
  reach-api:
    label: Deck to the identity API
    source: deck-client
    target: identity-api
    route: [street-net, exchange-gate, exchange-dmz]
    protocol: tcp/443
    parameters:
      connect:
        status: illustrative
        ttc: "Exponential(mean 0.1)"
        note: Teaching input
  api-to-db:
    label: API to the vault database
    source: identity-api
    target: vault-db
    route: [exchange-dmz, floor-router, trading-floor]
    protocol: tcp/5432
    parameters:
      connect:
        status: illustrative
        ttc: "Exponential(mean 0.1)"
        note: Teaching input
  terminal-to-db:
    label: Ops terminal to the vault database
    source: db-client
    target: vault-db
    route: [trading-floor]
    protocol: tcp/5432
    parameters:
      connect:
        status: illustrative
        ttc: "Exponential(mean 0.1)"
        note: Teaching input

clusters:
  rig:
    label: Decker's rig
    members: [decker-rig, deck-client]
    closed: true
  gateway:
    label: Exchange gateway
    members: [exchange-gate, gate-ice]
    closed: true
  api:
    label: Identity API
    members: [api-node, identity-api, veritas]
    closed: true
  terminal:
    label: Inside terminal
    members: [ops-terminal, db-client]
    shown: [ops-terminal]
    closed: true
  vault:
    label: Vault
    members:
      - vault-node
      - vault-db
      - strongroom
      - hsm
      - dossier-key
      - identity-dossiers
    closed: false

attacker:
  footholds:
    - {entity: decker-rig, state: admin}
    - {entity: ops-terminal, state: admin}
  target: {entity: identity-dossiers, state: read}

scenarios:
  vendor-patch:
    label: Apply the pending VeritasID patch
    changes:
      - {entity: veritas, defense: patched, value: true}
  encrypt-at-rest:
    label: Turn on encryption at rest
    changes:
      - {entity: identity-dossiers, defense: encrypted, value: true}
  patch-and-encrypt:
    label: Patch the API and encrypt at rest
    changes:
      - {entity: veritas, defense: patched, value: true}
      - {entity: identity-dossiers, defense: encrypted, value: true}
  patch-encrypt-seal:
    label: Patch, encrypt at rest and seal the HSM key
    changes:
      - {entity: veritas, defense: patched, value: true}
      - {entity: identity-dossiers, defense: encrypted, value: true}
      - {entity: dossier-key, defense: protected, value: true}

analysis:
  seed: 112
  samples: 10000
  confidence: 0.95
