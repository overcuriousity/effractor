effractor: 2
profile: fault-tree
name: Metro edge node goes dark
time_unit: h
horizon: 8760
currency: EUR
top: edge-node-dark

nodes:
  edge-node-dark:
    label: Edge compute node in Kowloon Street station stops serving
    description: One ruggedised edge server in a subway service closet runs the station's ticket gates, CCTV analytics and passenger Wi-Fi portal for a year. It has one power feed with a small UPS and one fibre uplink. Rates are illustrative time-to-first-failure values without repair; the single fibre is the weak spot everyone knows about and nobody has budget for.
    gate: or
    children: [power-lost, uplink-lost, server-fails]
    consequences:
      - {asset: station-services, dim: a}
  power-lost:
    label: Closet loses power long enough to drain the UPS
    gate: and
    children: [mains-outage, ups-exhausted]
  mains-outage:
    label: Station mains feed fails for more than 20 minutes
    leaf: basic
    rate: 8e-5
  ups-exhausted:
    label: UPS batteries cannot bridge the outage
    description: Per demand; batteries are three years old and never load-tested.
    leaf: basic
    p: 0.35
  uplink-lost:
    label: Single fibre uplink to the metro core is cut
    description: Track works and cable theft along the tunnel run.
    leaf: basic
    rate: 4e-5
  server-fails:
    label: Edge server hardware fails
    gate: or
    children: [disk-fails, overheat]
  disk-fails:
    label: Boot SSD wears out or dies
    leaf: basic
    rate: 1e-5
  overheat:
    label: Closet overheats in a summer heat wave and the server throttles to death
    leaf: undeveloped
    p: 0.02

assets:
  station-services:
    label: Gates, CCTV analytics and Wi-Fi portal at one station
    description: Manual gate staffing, missed incidents and SLA penalties.
    loss: {a: "Pert(8000, 25000, 120000)"}

controls:
  second-uplink:
    label: Second fibre uplink over the ventilation shaft
    cost: 14000
    enabled: false
    effects:
      - {node: uplink-lost, ttc: "Exponential(mean 250000)"}
  ups-refresh:
    label: Replace UPS batteries and load-test them yearly
    cost: 900
    enabled: false
    effects:
      - {node: ups-exhausted, ttc: "5%"}

analysis:
  seed: 101
  samples: 10000
  confidence: 0.95
