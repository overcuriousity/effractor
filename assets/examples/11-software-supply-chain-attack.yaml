# Fictional training model; high-level software delivery trust boundaries.
effractor: 1
profile: attack-tree
name: Unauthorized software reaches production
time_unit: d
horizon: 90
currency: EUR
top: unauthorized-release

nodes:
  unauthorized-release:
    label: Production accepts an unauthorized software release
    description: >-
      Compare source, build and artifact-distribution routes for one quarter.
      Shared publisher identity and deployment approval events remain single
      variables. Gates express sufficient combinations, not an ordered attack
      graph. Infinity blocks only the explicitly retired legacy upload route.
    gate: or
    children: [source-route, build-route, registry-route, legacy-route]
    consequences:
      - {asset: production-service, dim: i}
      - {asset: incident-response, dim: a}
  source-route:
    label: A source change survives release safeguards
    gate: and
    children: [source-write, review-bypass, deployment-approval]
  source-write:
    label: Obtain a source-write capability
    gate: or
    children: [maintainer-account, source-automation-token]
  maintainer-account:
    label: Control a repository maintainer account
    leaf: basic
    ttc: "Bernoulli(0.35) * LogNormal(3, 0.7)"
    cost: 5000
    detection: 0.25
  source-automation-token:
    label: Obtain a source-write automation token
    leaf: basic
    ttc: "Bernoulli(0.2) * Gamma(2, 15)"
    cost: 8000
    detection: 0.1
  review-bypass:
    label: Defeat independent source review
    leaf: basic
    ttc: "Bernoulli(0.25) * Exponential(0.02)"
    cost: 4000
    detection: 0.4
  build-route:
    label: A compromised build yields an accepted artifact
    gate: and
    children: [build-environment, publisher-identity, deployment-approval]
  build-environment:
    label: Control build inputs or execution
    gate: or
    children: [runner-control, dependency-substitution]
  runner-control:
    label: Control a release build runner
    leaf: basic
    ttc: "Bernoulli(0.3) * Gamma(3, 12)"
    cost: 12000
    detection: 0.35
  dependency-substitution:
    label: Substitute an unverified build dependency
    leaf: undeveloped
    ttc: "Bernoulli(0.2) * Pareto(10, 2.2)"
    cost: 6000
    detection: 0.15
  publisher-identity:
    label: Obtain release publishing authority
    gate: or
    children: [publisher-session, signing-service-identity]
  publisher-session:
    label: Obtain a release publisher session
    leaf: basic
    ttc: "Bernoulli(0.2) * LogNormal(3.5, 0.6)"
    cost: 9000
    detection: 0.2
  signing-service-identity:
    label: Obtain use of the release signing identity
    leaf: basic
    ttc: "Bernoulli(0.12) * Gamma(3, 20)"
    cost: 16000
    detection: 0.08
  deployment-approval:
    label: Defeat independent production release approval
    leaf: basic
    ttc: "Bernoulli(0.4) * Exponential(0.025)"
    cost: 3000
    detection: 0.45
  registry-route:
    label: Replace a distributed artifact that production trusts
    gate: and
    children: [registry-write, publisher-identity, provenance-check-bypass]
  registry-write:
    label: Gain write access to the artifact registry
    leaf: basic
    ttc: "Bernoulli(0.25) * Gamma(2, 18)"
    cost: 6500
    detection: 0.2
  provenance-check-bypass:
    label: Defeat deployment provenance checks
    leaf: basic
    ttc: "Bernoulli(0.3) * LogNormal(3.2, 0.8)"
    cost: 7000
    detection: 0.3
  legacy-route:
    label: Use the legacy direct-upload deployment path
    gate: and
    children: [legacy-upload-access, legacy-path-available]
  legacy-upload-access:
    label: Obtain a legacy upload credential
    leaf: basic
    ttc: "Bernoulli(0.35) * Exponential(0.035)"
    cost: 3500
    detection: 0.12
  legacy-path-available:
    label: Legacy direct-upload path remains enabled
    description: Zero means this architectural precondition is already true.
    leaf: basic
    ttc: "Zero"
    cost: 0
    detection: 0

assets:
  production-service:
    label: Production software and data integrity
    loss: {i: "Pert(150000, 800000, 5000000)"}
  incident-response:
    label: Investigation and release recovery
    loss: {a: "Pert(30000, 160000, 700000)"}

controls:
  retire-legacy-upload:
    label: Remove the legacy direct-upload path
    description: Blocks this route by removing it; other release routes remain.
    cost: 8000
    enabled: false
    effects:
      - {node: legacy-path-available, ttc: "Infinity"}
  isolated-builds:
    label: Ephemeral isolated builds with pinned dependencies
    cost: 18000
    enabled: false
    effects:
      - {node: runner-control, ttc: "Bernoulli(0.06) * Gamma(3, 25)"}
      - {node: dependency-substitution, ttc: "Bernoulli(0.025) * Pareto(30, 2.2)"}
  protected-publishing:
    label: Hardware-bound release publishing identities
    cost: 12000
    enabled: true
    effects:
      - {node: publisher-session, ttc: "Bernoulli(0.04) * LogNormal(4, 0.6)"}
      - {node: signing-service-identity, ttc: "Bernoulli(0.025) * Gamma(3, 30)"}
  provenance-enforcement:
    label: Enforce independent artifact provenance verification
    cost: 9500
    enabled: false
    effects:
      - {node: provenance-check-bypass, ttc: "Bernoulli(0.04) * LogNormal(4, 0.8)"}

analysis: {seed: 111, samples: 10000, confidence: 0.95}
