effractor: 2
profile: architecture
name: Night-market ramen bar
time_unit: d
horizon: 30
library: {id: core-components, version: 1}

entities:
  guest-wifi:
    kind: network
    label: Guest Wi-Fi
    description: The open "RAMEN-FREE" network the customers use
  shop-lan:
    kind: network
    label: Shop LAN
    description: The till server, the kitchen display and the owner's tablet
  isp-box:
    kind: router
    label: ISP router
    description: The consumer router the provider shipped; guest isolation is a checkbox
    parameters:
      escape:
        status: unknown
  isp-box-rules:
    kind: firewall
    label: ISP router rules
  customer-laptop:
    kind: host
    label: A customer's laptop
    description: Someone at the counter with a laptop and an evening to spare
    parameters:
      escape:
        status: unknown
  browser:
    kind: application
    label: Browser
    parameters:
      take-over:
        status: unknown
      take-over-guarded:
        status: unknown
    defenses: {guarded: unknown}
  till-server:
    kind: host
    label: Till server
    description: A mini PC under the counter running the point-of-sale back office
    parameters:
      escape:
        status: unknown
  pos-backoffice:
    kind: service
    label: POS back office
    description: The till vendor's web back office on port 8443, reachable from the LAN
    parameters:
      deploy-exploit:
        status: illustrative
        ttc: "Exponential(mean 0.5)"
        note: "Teaching input: a public advisory with a proof of concept exists"
      login:
        status: unknown
      take-over:
        status: unknown
      take-over-guarded:
        status: unknown
    defenses: {guarded: unknown}
  pos-software:
    kind: product
    label: TillWise POS 4.2
    parameters:
      find-exploit:
        status: illustrative
        ttc: "Exponential(mean 5)"
        note: "Teaching input: 4.2 has a published advisory; finding and adapting it takes days"
      find-exploit-patched:
        status: illustrative
        ttc: "Exponential(mean 400)"
        note: "Teaching input: 4.3 fixes the advisory; a new bug would take much longer"
    defenses: {patched: false}
  loyalty-db:
    kind: data
    label: Loyalty card list
    description: Names, phone numbers and order history of 3,000 regulars
    defenses: {encrypted: false}

associations:
  laptop-on-guest:
    kind: attached
    from: customer-laptop
    to: guest-wifi
  router-on-guest:
    kind: attached
    from: isp-box
    to: guest-wifi
  router-on-lan:
    kind: attached
    from: isp-box
    to: shop-lan
  till-on-lan:
    kind: attached
    from: till-server
    to: shop-lan
  router-filters:
    kind: filters
    from: isp-box
    to: isp-box-rules
  laptop-runs-browser:
    kind: hosts
    from: customer-laptop
    to: browser
    privilege: user
  till-runs-pos:
    kind: hosts
    from: till-server
    to: pos-backoffice
    privilege: admin
    description: The vendor's installer runs the service as SYSTEM
  pos-is-tillwise:
    kind: instance-of
    from: pos-backoffice
    to: pos-software
  pos-holds-loyalty:
    kind: holds
    from: pos-backoffice
    to: loyalty-db
    privilege: user
    decrypts: true
  guest-to-lan:
    kind: permits
    from: isp-box-rules
    to: guest-to-backoffice
    allowed: true
    description: Guest isolation is off, as it shipped

flows:
  guest-to-backoffice:
    label: Guest Wi-Fi to the POS back office
    source: browser
    target: pos-backoffice
    route: [guest-wifi, isp-box, shop-lan]
    protocol: tcp/8443
    parameters:
      connect:
        status: illustrative
        ttc: "Exponential(mean 0.05)"
        note: "Teaching input: the till answers on the LAN within the hour"

attacker:
  footholds:
    - {entity: customer-laptop, state: admin}
  target: {entity: loyalty-db, state: read}

scenarios:
  guest-isolation:
    label: Turn on guest isolation
    changes:
      - {association: guest-to-lan, field: allowed, value: false}
  update-pos:
    label: Update the till software to 4.3
    changes:
      - {entity: pos-software, defense: patched, value: true}

analysis:
  seed: 107
  samples: 10000
  confidence: 0.95
