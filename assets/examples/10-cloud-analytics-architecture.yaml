effractor: 2
profile: architecture
name: Cloud analytics platform
time_unit: d
horizon: 30
library: {id: core-components, version: 1}

entities:
  internet:
    kind: network
    label: Internet
  cloud-net:
    kind: network
    label: Cloud VPC
  edge:
    kind: router
    label: Cloud edge
    parameters:
      escape:
        status: unknown
  edge-rules:
    kind: firewall
    label: Edge rules
  attacker-box:
    kind: host
    label: Attacker workstation
    parameters:
      escape:
        status: unknown
  attacker-client:
    kind: application
    label: Attacker client
    parameters:
      take-over:
        status: unknown
      take-over-guarded:
        status: unknown
    defenses: {guarded: unknown}
  analyst:
    kind: person
    label: Data analyst
    description: Reads mail and shared dashboards from anywhere
    parameters:
      phish:
        status: illustrative
        ttc: "Exponential(mean 9)"
        note: "Teaching input: a shared-dashboard lure"
      phish-trained:
        status: illustrative
        ttc: "Exponential(mean 50)"
        note: "Teaching input: training slows deception"
    defenses: {trained: false}
  runner-host:
    kind: host
    label: Build runner
    description: A cloud VM that runs the analytics jobs
    parameters:
      escape:
        status: unknown
  job-service:
    kind: service
    label: Job scheduler
    description: The internet-facing console where analysts submit and run jobs
    parameters:
      deploy-exploit:
        status: illustrative
        ttc: "Exponential(mean 4)"
        note: Teaching input
      login:
        status: illustrative
        ttc: "Exponential(mean 0.2)"
        note: Teaching input
      take-over:
        status: unknown
      take-over-guarded:
        status: unknown
    defenses: {guarded: unknown}
  job-software:
    kind: product
    label: JobRunner 3.1
    parameters:
      find-exploit:
        status: illustrative
        ttc: "Exponential(mean 20)"
        note: Teaching input
      find-exploit-patched:
        status: illustrative
        ttc: "Never"
        note: "Teaching input: 3.2 closes the modelled bug"
    defenses: {patched: false}
  warehouse-host:
    kind: host
    label: Warehouse node
    parameters:
      escape:
        status: unknown
  warehouse-software:
    kind: product
    label: WarehouseDB 12
    parameters:
      find-exploit:
        status: illustrative
        ttc: "Never"
        note: "Teaching input: no warehouse exploit is modelled here"
      find-exploit-patched:
        status: illustrative
        ttc: "Never"
        note: Teaching input
    defenses: {patched: false}
  warehouse:
    kind: service
    label: Data warehouse
    description: Holds the customer tables; serves rows to logged-in roles
    parameters:
      deploy-exploit:
        status: illustrative
        ttc: "Never"
        note: "Teaching input: this exercise studies the identity route, not a warehouse exploit"
      login:
        status: illustrative
        ttc: "Exponential(mean 0.2)"
        note: "Teaching input: a query login with a valid token"
      take-over:
        status: unknown
      take-over-guarded:
        status: unknown
    defenses: {guarded: unknown}
  analyst-account:
    kind: account
    label: Analyst login
    parameters:
      admin-login:
        status: unknown
      mfa-bypass:
        status: illustrative
        ttc: "Exponential(mean 12)"
        note: "Teaching input: adversary-in-the-middle against the login"
    defenses: {mfa: false}
  runner-identity:
    kind: account
    label: Runner workload identity
    description: The identity the build runner's jobs execute as; it has no second factor
    parameters:
      admin-login:
        status: unknown
      mfa-bypass:
        status: unknown
    defenses: {mfa: unknown}
  reader-role:
    kind: account
    label: Warehouse reader role
    description: A role the runner identity may assume; it reads every table
    parameters:
      admin-login:
        status: unknown
      mfa-bypass:
        status: unknown
    defenses: {mfa: unknown}
  analyst-password:
    kind: credential
    label: Analyst password
    description: What the analyst would type into a fake single-sign-on page
    parameters:
      extract:
        status: unknown
      extract-protected:
        status: unknown
    defenses: {protected: unknown}
  hardware-key:
    kind: credential
    label: Analyst hardware key
    description: The analyst's second factor; a hardware key cannot be copied remotely
    parameters:
      extract:
        status: illustrative
        ttc: "Never"
        note: Teaching input
      extract-protected:
        status: illustrative
        ttc: "Never"
        note: Teaching input
    defenses: {protected: false}
  customer-tables:
    kind: data
    label: Customer tables
    description: The customer records the attacker wants to read
    defenses: {encrypted: false}

associations:
  attacker-internet:
    kind: attached
    from: attacker-box
    to: internet
  edge-internet:
    kind: attached
    from: edge
    to: internet
  edge-cloud:
    kind: attached
    from: edge
    to: cloud-net
  runner-cloud:
    kind: attached
    from: runner-host
    to: cloud-net
  warehouse-cloud:
    kind: attached
    from: warehouse-host
    to: cloud-net
  edge-filters:
    kind: filters
    from: edge
    to: edge-rules
  attacker-runs-client:
    kind: hosts
    from: attacker-box
    to: attacker-client
    privilege: user
  runner-runs-jobs:
    kind: hosts
    from: runner-host
    to: job-service
    privilege: admin
  jobs-are-jobrunner:
    kind: instance-of
    from: job-service
    to: job-software
  warehouse-runs:
    kind: hosts
    from: warehouse-host
    to: warehouse
    privilege: admin
  warehouse-is-software:
    kind: instance-of
    from: warehouse
    to: warehouse-software
  mail-to-analyst:
    kind: delivers
    from: internet
    to: analyst
  analyst-knows-password:
    kind: knows
    from: analyst
    to: analyst-password
  password-authenticates:
    kind: authenticates
    from: analyst-password
    to: analyst-account
  key-authenticates:
    kind: authenticates
    from: hardware-key
    to: analyst-account
    factor: second
  analyst-authorizes-jobs:
    kind: authorizes
    from: analyst-account
    to: job-service
  analyst-grant:
    kind: grants
    from: analyst-account
    to: runner-host
    privilege: admin
    description: Analysts hold an admin grant on the runner so their jobs can install packages
  runner-runs-as-identity:
    kind: runs-as
    from: job-service
    to: runner-identity
    privilege: user
  identity-assumes-reader:
    kind: assumes
    from: runner-identity
    to: reader-role
  reader-authorizes-warehouse:
    kind: authorizes
    from: reader-role
    to: warehouse
  warehouse-holds-tables:
    kind: holds
    from: warehouse
    to: customer-tables
    privilege: user
    decrypts: true
    description: The warehouse serves rows, so it sees plaintext
  reader-reads-tables:
    kind: accesses
    from: reader-role
    to: customer-tables
    mode: read
  console-flow:
    kind: permits
    from: edge-rules
    to: console
    allowed: true

flows:
  console:
    label: Client to the job scheduler
    source: attacker-client
    target: job-service
    route: [internet, edge, cloud-net]
    protocol: tcp/443
    parameters:
      connect:
        status: illustrative
        ttc: "Exponential(mean 0.1)"
        note: Teaching input
  job-to-warehouse:
    label: Runner to the warehouse
    source: job-service
    target: warehouse
    route: [cloud-net]
    protocol: tcp/443
    parameters:
      connect:
        status: illustrative
        ttc: "Exponential(mean 0.1)"
        note: Teaching input

attacker:
  footholds:
    - {entity: attacker-box, state: admin}
  target: {entity: customer-tables, state: read}

scenarios:
  train-analyst:
    label: Train the analyst
    changes:
      - {entity: analyst, defense: trained, value: true}
  require-mfa:
    label: Require the analyst's second factor at every login
    changes:
      - {entity: analyst-account, defense: mfa, value: true}
  patch-jobrunner:
    label: Update the job runner to 3.2
    changes:
      - {entity: job-software, defense: patched, value: true}
  patch-and-harden-people:
    label: Patch the job runner and harden the analyst (training and second factor)
    changes:
      - {entity: job-software, defense: patched, value: true}
      - {entity: analyst, defense: trained, value: true}
      - {entity: analyst-account, defense: mfa, value: true}

analysis:
  seed: 110
  samples: 10000
  confidence: 0.95
