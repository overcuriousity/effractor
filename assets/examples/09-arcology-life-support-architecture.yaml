effractor: 2
profile: architecture
name: Arcology Nine life support
time_unit: d
horizon: 60
library: {id: core-components, version: 1}

entities:
  citynet:
    kind: network
    label: Citynet
  facilities-net:
    kind: network
    label: Halcyon facilities network
    description: Halcyon Dynamics' facilities office network, where the life-support engineers sit
  life-support-net:
    kind: network
    label: Life-support network
    description: The controllers and sensors of Arcology Nine's upper floors
  tower-router:
    kind: router
    label: Tower edge router
    parameters:
      escape:
        status: unknown
  tower-firewall:
    kind: firewall
    label: Tower firewall
    description: Only the facilities supervisory link is meant to reach the life-support network
  engineer-rig:
    kind: host
    label: Engineer's rig
    description: A life-support engineer's workstation on the facilities network
    parameters:
      escape:
        status: unknown
  supervisory-console:
    kind: application
    label: Supervisory console
    description: The SCADA/HMI client the engineer drives air, water and lifts with
    parameters:
      take-over:
        status: unknown
      take-over-guarded:
        status: unknown
    defenses: {guarded: unknown}
  atmos-controller:
    kind: host
    label: Atmospherics controller
    description: The programmable controller that runs the air scrubbers, lifts and blast doors for floors 180 to 240
    parameters:
      escape:
        status: unknown
  atmos-management:
    kind: service
    label: Controller management service
    description: The controller's web management interface on tcp/443
    parameters:
      deploy-exploit:
        status: illustrative
        ttc: "Exponential(mean 3)"
        note: Teaching input
      login:
        status: illustrative
        ttc: "Exponential(mean 0.3)"
        note: "Teaching input: a management login with valid credentials"
      take-over:
        status: unknown
      take-over-guarded:
        status: unknown
    defenses: {guarded: unknown}
  atmologic:
    kind: product
    label: Verdance AtmoLogic 7.1
    parameters:
      find-exploit:
        status: illustrative
        ttc: "Exponential(mean 25)"
        note: "Teaching input: an OT controller with a slow patch cycle"
      find-exploit-patched:
        status: illustrative
        ttc: "Never"
        note: "Teaching input: firmware 7.2 closes the modelled bug"
    defenses: {patched: false}
  ops-login:
    kind: account
    label: Operations login
    description: The shared operations login on the controller
    parameters:
      admin-login:
        status: illustrative
        ttc: "Exponential(mean 0.5)"
        note: "Teaching input: management authentication once the network is reached"
      mfa-bypass:
        status: illustrative
        ttc: "Exponential(mean 30)"
        note: "Teaching input: the controller only offers a weak second factor"
    defenses: {mfa: false}
  ops-password:
    kind: credential
    label: Operations password
    description: Saved in the engineer's rig's credential store
    parameters:
      extract:
        status: illustrative
        ttc: "Exponential(mean 1)"
        note: Teaching input
      extract-protected:
        status: illustrative
        ttc: "Never"
        note: "Teaching input: an OS-bound store gives nothing up"
    defenses: {protected: false}
  atmos-controls:
    kind: data
    label: Atmospherics control state
    description: Air-mix setpoints, blast-door schedules and lift logic; changing it is the attacker's goal
    defenses: {encrypted: false}

associations:
  router-citynet:
    kind: attached
    from: tower-router
    to: citynet
  router-facilities:
    kind: attached
    from: tower-router
    to: facilities-net
  router-life-support:
    kind: attached
    from: tower-router
    to: life-support-net
  rig-on-facilities:
    kind: attached
    from: engineer-rig
    to: facilities-net
  controller-on-life-support:
    kind: attached
    from: atmos-controller
    to: life-support-net
  router-filters:
    kind: filters
    from: tower-router
    to: tower-firewall
  rig-runs-console:
    kind: hosts
    from: engineer-rig
    to: supervisory-console
    privilege: user
  controller-runs-management:
    kind: hosts
    from: atmos-controller
    to: atmos-management
    privilege: admin
  management-is-atmologic:
    kind: instance-of
    from: atmos-management
    to: atmologic
  password-stored:
    kind: stores
    from: engineer-rig
    to: ops-password
    privilege: user
  password-authenticates:
    kind: authenticates
    from: ops-password
    to: ops-login
  ops-authorizes:
    kind: authorizes
    from: ops-login
    to: atmos-management
  ops-grant:
    kind: grants
    from: ops-login
    to: atmos-controller
    privilege: admin
    description: The operations login is an administrator on the controller
  facilities-administers-atmos:
    kind: administration
    from: facilities-net
    to: atmos-controller
    description: The management link lets the facilities network administer the controller
  supervisory-flow:
    kind: permits
    from: tower-firewall
    to: supervise
    allowed: true
  controller-holds-controls:
    kind: holds
    from: atmos-management
    to: atmos-controls
    privilege: user
    decrypts: true
  ops-writes-controls:
    kind: accesses
    from: ops-login
    to: atmos-controls
    mode: write

flows:
  supervise:
    label: Supervisory console to the controller
    source: supervisory-console
    target: atmos-management
    route: [facilities-net, tower-router, life-support-net]
    protocol: tcp/443
    parameters:
      connect:
        status: illustrative
        ttc: "Exponential(mean 0.1)"
        note: Teaching input

clusters:
  engineer-rig:
    label: Engineer's rig
    members: [engineer-rig, supervisory-console]
    shown: [engineer-rig]
    closed: true
  atmos-controller:
    label: Atmospherics controller
    members: [atmos-controller, atmos-management, atmologic]
    closed: true
  tower-edge:
    label: Tower edge
    members: [tower-router, tower-firewall]
    closed: false
  ops-access:
    label: Operations access
    members: [ops-login, ops-password]
    closed: false

attacker:
  footholds:
    - {entity: engineer-rig, state: admin}
  target: {entity: atmos-controls, state: modified}

scenarios:
  deny-supervisory:
    label: Deny the supervisory flow at the firewall
    changes:
      - {association: supervisory-flow, field: allowed, value: false}
  patch-firmware:
    label: Update the controller to AtmoLogic 7.2
    changes:
      - {entity: atmologic, defense: patched, value: true}
  require-mfa:
    label: Require multi-factor login on the controller
    changes:
      - {entity: ops-login, defense: mfa, value: true}
  protect-password:
    label: Move the operations password to an OS-bound store
    changes:
      - {entity: ops-password, defense: protected, value: true}
  segment-and-protect:
    label: Protect the password and deny the supervisory flow
    changes:
      - {entity: ops-password, defense: protected, value: true}
      - {association: supervisory-flow, field: allowed, value: false}

analysis:
  seed: 109
  samples: 10000
  confidence: 0.95
