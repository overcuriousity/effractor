# Fictional training model; high-level physical security assumptions only.
effractor: 1
profile: attack-tree
name: Museum collection item stolen
time_unit: d
horizon: 90
currency: EUR
top: item-stolen

nodes:
  item-stolen:
    label: Remove a collection item from the museum
    description: >-
      Compare public-access, staff-access and storage routes over 90 days.
      Conditions start in parallel; this tree does not simulate a sequence of
      movements. Each route includes removal through the shared exit-control
      boundary. Detection is an attacker objective, not automatic prevention.
    gate: and
    children: [item-access, removal-undetected]
    consequences:
      - {asset: collection-item, dim: a}
      - {asset: museum-operations, dim: a}
  item-access:
    label: Gain physical control of the item
    gate: or
    children: [public-gallery, staff-access, storage-access]
  public-gallery:
    label: Obtain the displayed item during public access
    gate: and
    children: [display-case-defeated, gallery-supervision-gap]
  display-case-defeated:
    label: Defeat the display enclosure
    leaf: basic
    ttc: "Bernoulli(0.4) * Gamma(2, 8)"
    cost: 2500
    detection: 0.65
  gallery-supervision-gap:
    label: Find a sufficient gallery supervision gap
    leaf: basic
    ttc: "Exponential(0.025)"
    cost: 800
    detection: 0.1
  staff-access:
    label: Abuse access granted to a collection handler
    gate: and
    children: [handler-cooperation, inventory-check-defeated]
  handler-cooperation:
    label: Obtain cooperation from an authorized handler
    leaf: undeveloped
    ttc: "Bernoulli(0.15) * LogNormal(3.2, 0.6)"
    cost: 14000
    detection: 0.08
  inventory-check-defeated:
    label: Evade the independent inventory check
    leaf: basic
    ttc: "Bernoulli(0.35) * Exponential(0.03)"
    cost: 1200
    detection: 0.2
  storage-access:
    label: Gain access to the off-display collection
    gate: and
    children: [store-access-defeated, store-monitoring-defeated]
  store-access-defeated:
    label: Defeat the storage access boundary
    leaf: basic
    ttc: "Bernoulli(0.3) * Gamma(3, 10)"
    cost: 6000
    detection: 0.4
  store-monitoring-defeated:
    label: Evade storage monitoring
    leaf: basic
    ttc: "Bernoulli(0.2) * Exponential(0.02)"
    cost: 3500
    detection: 0.3
  removal-undetected:
    label: Defeat collection-item exit checks
    leaf: basic
    ttc: "Bernoulli(0.45) * Exponential(0.04)"
    cost: 2000
    detection: 0.25

assets:
  collection-item:
    label: Collection item and recovery effort
    description: Illustrative financial exposure, not the item's cultural value.
    loss: {a: "Pert(150000, 600000, 2000000)"}
  museum-operations:
    label: Closure and investigation
    loss: {a: "Pert(15000, 45000, 160000)"}

controls:
  display-upgrade:
    label: Upgrade display enclosures
    cost: 5500
    enabled: false
    effects:
      - {node: display-case-defeated, ttc: "Bernoulli(0.12) * Gamma(2, 20)"}
  independent-inventory:
    label: Independent collection movement reconciliation
    cost: 3200
    enabled: true
    effects:
      - {node: inventory-check-defeated, ttc: "Bernoulli(0.08) * Exponential(0.015)"}
  exit-checks:
    label: Strengthen all collection-item exit checks
    cost: 4800
    enabled: false
    effects:
      - {node: removal-undetected, ttc: "Bernoulli(0.1) * Exponential(0.02)"}

analysis: {seed: 108, samples: 10000, confidence: 0.95}
