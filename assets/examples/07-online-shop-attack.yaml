# Fictional training model; attacker effort and EUR losses are illustrative.
effractor: 1
profile: attack-tree
name: Online shop customer records disclosed
time_unit: d
horizon: 30
currency: EUR
top: customer-export

nodes:
  customer-export:
    label: Obtain a customer-record export
    description: >-
      A small shop has a staff export page and an integration export token.
      AND means both conditions are achieved within 30 days; it does not add
      their durations. Costs describe attacker effort; control costs are the
      shop's expenditure for this month. All inputs are illustrative.
    gate: or
    children: [staff-session, integration-token]
    consequences:
      - {asset: customer-records, dim: c}
  staff-session:
    label: Obtain an export-capable staff session
    gate: and
    children: [staff-password, second-factor]
  staff-password:
    label: Obtain an export user's password
    leaf: basic
    ttc: "50% * Exponential(mean 12.5)"
    cost: 300
    detection: 0.15
  second-factor:
    label: Defeat the account's second factor
    leaf: basic
    ttc: "25% * Gamma(2, 4)"
    cost: 800
    detection: 0.6
  integration-token:
    label: Obtain a still-valid export integration token
    leaf: undeveloped
    ttc: "30% * Exponential(mean 28.6)"
    cost: 1800
    detection: 0.05

assets:
  customer-records:
    label: Customer contact and order records
    loss: {c: "Pert(12000, 75000, 350000)"}

controls:
  phishing-resistant-auth:
    label: Phishing-resistant staff authentication
    cost: 240
    enabled: false
    effects:
      - {node: second-factor, ttc: "3% * Gamma(2, 12)"}
  token-hygiene:
    label: Short-lived and narrowly scoped export tokens
    cost: 180
    enabled: true
    effects:
      - {node: integration-token, ttc: "6% * Exponential(mean 50)"}

analysis: {seed: 107, samples: 10000, confidence: 0.95}
