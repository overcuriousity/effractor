# Fictional training model; rates, probabilities and EUR losses are illustrative.
effractor: 1
profile: fault-tree
name: Data center cooling capacity exhausted
time_unit: h
horizon: 2160
currency: EUR
top: thermal-shutdown

nodes:
  thermal-shutdown:
    label: Compute hall reaches thermal shutdown
    description: >-
      Three equal cooling units; two are required at peak load. The vote gate
      therefore counts two failed units. Failures persist for this 90-day
      no-repair mission. Flooding is a shared cause affecting every unit.
    gate: or
    children: [insufficient-cooling, distribution-lost]
    consequences:
      - {asset: hosted-services, dim: a}
      - {asset: cooling-equipment, dim: a, fraction: 0.2}
  insufficient-cooling:
    label: At least two of three cooling units fail
    gate: vote
    k: 2
    children: [unit-a, unit-b, unit-c]
  unit-a:
    label: Cooling unit A unavailable
    gate: or
    children: [compressor-a, plant-room-flood]
  unit-b:
    label: Cooling unit B unavailable
    gate: or
    children: [compressor-b, plant-room-flood]
  unit-c:
    label: Cooling unit C unavailable
    gate: or
    children: [compressor-c, plant-room-flood]
  compressor-a:
    label: Compressor A fails
    leaf: basic
    rate: 0.000025
  compressor-b:
    label: Compressor B fails
    leaf: basic
    rate: 0.000025
  compressor-c:
    label: Compressor C fails
    leaf: basic
    rate: 0.000035
  plant-room-flood:
    label: Flood disables the common plant room
    leaf: undeveloped
    p: 0.008
    consequences:
      - {asset: cooling-equipment, dim: a}
  distribution-lost:
    label: Chilled water cannot reach the hall
    gate: or
    children: [header-rupture, both-circulation-pumps]
  header-rupture:
    label: Shared chilled-water header ruptures
    leaf: basic
    rate: 0.000002
  both-circulation-pumps:
    label: Both circulation pumps fail
    gate: and
    children: [circulation-a, circulation-b]
  circulation-a:
    label: Circulation pump A fails
    leaf: basic
    rate: 0.00003
  circulation-b:
    label: Circulation pump B fails
    leaf: basic
    rate: 0.00003

assets:
  hosted-services:
    label: Hosted service interruption
    loss: {a: "Pert(80000, 240000, 1200000)"}
  cooling-equipment:
    label: Cooling equipment replacement
    description: Flood damage supersedes the 20 percent thermal-shutdown allowance.
    loss: {a: 300000}

controls:
  flood-barrier:
    label: Plant-room flood protection
    cost: 4500
    enabled: false
    effects:
      - {node: plant-room-flood, ttc: "0.1%"}
  compressor-overhaul:
    label: Overhaul the older third compressor
    cost: 1800
    enabled: false
    effects:
      - {node: compressor-c, ttc: "Exponential(mean 83300)"}
  header-inspection:
    label: Header inspection and renewal
    cost: 950
    enabled: true
    effects:
      - {node: header-rupture, ttc: "Exponential(mean 1670000)"}

analysis: {seed: 103, samples: 10000, confidence: 0.95}
