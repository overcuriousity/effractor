effractor: 2
profile: architecture
name: Autonomous DevOps assistant
time_unit: d
horizon: 21
library: {id: core-components, version: 1}

entities:
  internet:
    kind: network
    label: Internet
  cloud-net:
    kind: network
    label: Cloud network
  edge:
    kind: router
    label: Cloud edge
    parameters:
      escape:
        status: unknown
  edge-rules:
    kind: firewall
    label: Edge rules
  attacker-box:
    kind: host
    label: Attacker workstation
    parameters:
      escape:
        status: unknown
  attacker-client:
    kind: application
    label: Attacker client
    parameters:
      take-over:
        status: unknown
      take-over-guarded:
        status: unknown
    defenses: {guarded: unknown}
  wiki-host:
    kind: host
    label: Wiki server
    parameters:
      escape:
        status: unknown
  wiki:
    kind: service
    label: Runbook wiki
    description: The internet-facing wiki that holds the operations runbooks
    parameters:
      deploy-exploit:
        status: illustrative
        ttc: "Exponential(mean 5)"
        note: Teaching input
      login:
        status: illustrative
        ttc: "Exponential(mean 0.3)"
        note: Teaching input
      take-over:
        status: unknown
      take-over-guarded:
        status: unknown
    defenses: {guarded: unknown}
  wiki-software:
    kind: product
    label: RunbookWiki 2.0
    parameters:
      find-exploit:
        status: illustrative
        ttc: "Exponential(mean 14)"
        note: Teaching input
      find-exploit-patched:
        status: illustrative
        ttc: "Never"
        note: "Teaching input: 2.1 closes the modelled bug"
    defenses: {patched: false}
  agent-vm:
    kind: host
    label: Assistant VM
    parameters:
      escape:
        status: unknown
  assistant:
    kind: service
    label: DevOps assistant
    description: An autonomous agent that reads runbooks and public tickets and runs tools to fix incidents
    parameters:
      deploy-exploit:
        status: unknown
      login:
        status: unknown
      take-over:
        status: illustrative
        ttc: "Exponential(mean 2)"
        note: "Teaching input: instructions planted in content it reads (prompt injection)"
      take-over-guarded:
        status: illustrative
        ttc: "Exponential(mean 40)"
        note: "Teaching input: guardrails and human approval slow injection, they do not stop it"
    defenses: {guarded: false}
  assistant-software:
    kind: product
    label: AssistantFramework 1.4
    parameters:
      find-exploit:
        status: unknown
      find-exploit-patched:
        status: unknown
    defenses: {patched: false}
  secrets-host:
    kind: host
    label: Secrets service node
    parameters:
      escape:
        status: unknown
  secrets-service:
    kind: service
    label: Secrets service
    description: Serves deployment secrets to authorised workloads
    parameters:
      deploy-exploit:
        status: illustrative
        ttc: "Never"
        note: "Teaching input: this exercise studies the agent route, not a secrets-service exploit"
      login:
        status: illustrative
        ttc: "Exponential(mean 0.2)"
        note: Teaching input
      take-over:
        status: unknown
      take-over-guarded:
        status: unknown
    defenses: {guarded: unknown}
  secrets-software:
    kind: product
    label: VaultService 5
    parameters:
      find-exploit:
        status: illustrative
        ttc: "Never"
        note: Teaching input
      find-exploit-patched:
        status: illustrative
        ttc: "Never"
        note: Teaching input
    defenses: {patched: false}
  assistant-identity:
    kind: account
    label: Assistant workload identity
    description: The identity the assistant runs as; authorised to read deployment secrets
    parameters:
      admin-login:
        status: unknown
      mfa-bypass:
        status: unknown
    defenses: {mfa: unknown}
  runbooks:
    kind: data
    label: Operations runbooks
    description: The wiki pages the assistant reads before it acts
    defenses: {encrypted: false}
  deployment-secrets:
    kind: data
    label: Deployment secrets
    description: The production secrets the attacker wants to read
    defenses: {encrypted: false}

associations:
  attacker-internet:
    kind: attached
    from: attacker-box
    to: internet
  edge-internet:
    kind: attached
    from: edge
    to: internet
  edge-cloud:
    kind: attached
    from: edge
    to: cloud-net
  wiki-cloud:
    kind: attached
    from: wiki-host
    to: cloud-net
  agent-cloud:
    kind: attached
    from: agent-vm
    to: cloud-net
  secrets-cloud:
    kind: attached
    from: secrets-host
    to: cloud-net
  edge-filters:
    kind: filters
    from: edge
    to: edge-rules
  attacker-runs-client:
    kind: hosts
    from: attacker-box
    to: attacker-client
    privilege: user
  wiki-runs:
    kind: hosts
    from: wiki-host
    to: wiki
    privilege: admin
  wiki-is-software:
    kind: instance-of
    from: wiki
    to: wiki-software
  assistant-runs:
    kind: hosts
    from: agent-vm
    to: assistant
    privilege: user
    contained: true
    description: The assistant runs sandboxed; taking it over does not reach its VM, but its tools and identity still act
  assistant-is-software:
    kind: instance-of
    from: assistant
    to: assistant-software
  secrets-runs:
    kind: hosts
    from: secrets-host
    to: secrets-service
    privilege: admin
  secrets-is-software:
    kind: instance-of
    from: secrets-service
    to: secrets-software
  assistant-runs-as-identity:
    kind: runs-as
    from: assistant
    to: assistant-identity
    privilege: user
  identity-authorizes-secrets:
    kind: authorizes
    from: assistant-identity
    to: secrets-service
  wiki-holds-runbooks:
    kind: holds
    from: wiki
    to: runbooks
    privilege: user
    decrypts: true
  assistant-reads-runbooks:
    kind: reads
    from: assistant
    to: runbooks
    description: The assistant reads the runbooks before acting; changing them reaches it
  secrets-holds:
    kind: holds
    from: secrets-service
    to: deployment-secrets
    privilege: user
    decrypts: true
  identity-reads-secrets:
    kind: accesses
    from: assistant-identity
    to: deployment-secrets
    mode: read
  wiki-flow:
    kind: permits
    from: edge-rules
    to: wiki-edit
    allowed: true
  agent-to-secrets-flow:
    kind: permits
    from: edge-rules
    to: agent-to-secrets
    allowed: true

flows:
  wiki-edit:
    label: Client to the wiki
    source: attacker-client
    target: wiki
    route: [internet, edge, cloud-net]
    protocol: tcp/443
    parameters:
      connect:
        status: illustrative
        ttc: "Exponential(mean 0.1)"
        note: Teaching input
  agent-to-secrets:
    label: Assistant to the secrets service
    source: assistant
    target: secrets-service
    route: [cloud-net]
    protocol: tcp/443
    parameters:
      connect:
        status: illustrative
        ttc: "Exponential(mean 0.1)"
        note: Teaching input

attacker:
  footholds:
    - {entity: attacker-box, state: admin}
  target: {entity: deployment-secrets, state: read}

scenarios:
  guard-assistant:
    label: Guard the assistant against its content
    changes:
      - {entity: assistant, defense: guarded, value: true}
  patch-wiki:
    label: Update the wiki to 2.1
    changes:
      - {entity: wiki-software, defense: patched, value: true}
  guard-and-patch:
    label: Guard the assistant and patch the wiki
    changes:
      - {entity: assistant, defense: guarded, value: true}
      - {entity: wiki-software, defense: patched, value: true}

analysis:
  seed: 111
  samples: 10000
  confidence: 0.95
