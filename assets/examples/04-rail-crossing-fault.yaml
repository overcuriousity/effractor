# Fictional training model, not a safety assessment or calibrated railway data.
effractor: 1
profile: fault-tree
name: Rail crossing fails a demanded closure
time_unit: h
horizon: 0.03333333333333333 # Two minutes, expressed in the supported hour unit.
currency: EUR
top: closure-failed

nodes:
  closure-failed:
    label: Crossing protection does not complete on demand
    description: >-
      Conditional on one demanded closure within a two-minute response window.
      All p values are probabilities per demand, not annual rates. The top event
      is loss of protection, not a collision. No injury valuation is included.
    gate: or
    children: [no-detection, barrier-drive-failed, no-power, controller-failed]
    consequences:
      - {asset: crossing-service, dim: a}
  no-detection:
    label: Both independent approach detectors miss the demand
    gate: and
    children: [detector-a-missed, detector-b-missed]
  detector-a-missed:
    label: Approach detector A misses the demand
    leaf: basic
    p: 0.006
  detector-b-missed:
    label: Approach detector B misses the demand
    leaf: basic
    p: 0.008
  barrier-drive-failed:
    label: Barrier cannot lower
    gate: or
    children: [motor-unavailable, obstruction]
  motor-unavailable:
    label: Barrier drive motor is unavailable
    leaf: basic
    p: 0.002
  obstruction:
    label: Mechanical obstruction prevents closure
    leaf: undeveloped
    p: 0.003
  no-power:
    label: Mains and backup are both unavailable
    gate: and
    children: [mains-unavailable, battery-unavailable]
  mains-unavailable:
    label: Mains supply is absent at demand
    leaf: basic
    p: 0.01
  battery-unavailable:
    label: Backup battery cannot support a closure
    leaf: basic
    p: 0.04
  controller-failed:
    label: Common controller fails to command closure
    leaf: undeveloped
    p: 0.001

assets:
  crossing-service:
    label: Inspection and traffic interruption
    loss: {a: "Pert(1000, 8000, 60000)"}

controls:
  battery-proof-test:
    label: Frequent battery proof testing
    description: Cost allocated per demand for comparison within this model.
    cost: 0.5
    enabled: true
    effects:
      - {node: battery-unavailable, ttc: "Bernoulli(0.008)"}
  barrier-maintenance:
    label: Barrier drive and obstruction maintenance
    cost: 1.2
    enabled: false
    effects:
      - {node: motor-unavailable, ttc: "Bernoulli(0.0008)"}
      - {node: obstruction, ttc: "Bernoulli(0.001)"}
  controller-renewal:
    label: Renew the common controller
    cost: 2.5
    enabled: false
    effects:
      - {node: controller-failed, ttc: "Bernoulli(0.0002)"}

analysis: {seed: 104, samples: 10000, confidence: 0.95}
