effractor: 2
profile: architecture
name: Street surgeon's chrome clinic
time_unit: d
horizon: 30
library: {id: core-components, version: 1}

entities:
  citynet:
    kind: network
    label: Citynet
    description: Sodium City's public net
  medichrome-host:
    kind: host
    label: MediChrome cloud host
    description: The vendor's net-facing server the clinic's records portal runs on
    parameters:
      escape:
        status: unknown
  medichrome:
    kind: product
    label: MediChrome Clinic Suite
    parameters:
      find-exploit:
        status: illustrative
        ttc: "Never"
        note: "Teaching input: no portal exploit is modelled here"
      find-exploit-patched:
        status: illustrative
        ttc: "Never"
        note: "Teaching input: no portal exploit is modelled here"
    defenses: {patched: false}
  clinic-lan:
    kind: network
    label: Clinic LAN
  clinic-router:
    kind: router
    label: Clinic router
    parameters:
      escape:
        status: unknown
  clinic-router-rules:
    kind: firewall
    label: Router rules
  front-desk-pc:
    kind: host
    label: Front-desk terminal
    description: The machine behind the counter where the receptionist reads mail and books implant fittings
    parameters:
      escape:
        status: unknown
  mail-client:
    kind: application
    label: Mail and booking client
    parameters:
      take-over:
        status: illustrative
        ttc: "Exponential(mean 14)"
        note: "Teaching input: a malicious attachment that runs when opened"
      take-over-guarded:
        status: illustrative
        ttc: "Exponential(mean 90)"
        note: "Teaching input: attachment sandboxing slows it, it does not stop it"
    defenses: {guarded: false}
  receptionist:
    kind: person
    label: Receptionist
    description: Handles walk-ins, fitting bookings and mail from the chrome wholesalers all day
    parameters:
      phish:
        status: illustrative
        ttc: "Exponential(mean 12)"
        note: "Teaching input: a convincing fitting-booking lure"
      phish-trained:
        status: illustrative
        ttc: "Exponential(mean 45)"
        note: "Teaching input: training slows deception, it does not remove it"
    defenses: {trained: false}
  records-portal:
    kind: service
    label: Records portal
    description: The cloud records system the street surgeon's clinic logs in to
    parameters:
      deploy-exploit:
        status: unknown
      login:
        status: illustrative
        ttc: "Exponential(mean 0.2)"
        note: "Teaching input: a normal web login with valid credentials"
      take-over:
        status: unknown
      take-over-guarded:
        status: unknown
    defenses: {guarded: unknown}
  front-desk-login:
    kind: account
    label: Front-desk portal login
    parameters:
      admin-login:
        status: unknown
      mfa-bypass:
        status: illustrative
        ttc: "Exponential(mean 40)"
        note: "Teaching input: number-matching makes push fatigue slow and unlikely"
    defenses: {mfa: false}
  portal-password:
    kind: credential
    label: Portal password
    description: Known by the receptionist and saved in the front-desk terminal's browser
    parameters:
      extract:
        status: illustrative
        ttc: "Exponential(mean 1)"
        note: "Teaching input: a saved browser password is read once the terminal is controlled"
      extract-protected:
        status: illustrative
        ttc: "Never"
        note: "Teaching input: a managed password vault bound to the OS gives nothing up"
    defenses: {protected: false}
  implant-records:
    kind: data
    label: Implant records
    description: Cyberware fittings, implant serials and medical histories of about 8,000 patients, worth a fortune to chop shops
    defenses: {encrypted: false}

associations:
  router-citynet:
    kind: attached
    from: clinic-router
    to: citynet
  router-lan:
    kind: attached
    from: clinic-router
    to: clinic-lan
  front-desk-on-lan:
    kind: attached
    from: front-desk-pc
    to: clinic-lan
  medichrome-host-citynet:
    kind: attached
    from: medichrome-host
    to: citynet
  host-runs-portal:
    kind: hosts
    from: medichrome-host
    to: records-portal
    privilege: admin
  portal-is-medichrome:
    kind: instance-of
    from: records-portal
    to: medichrome
  router-filters:
    kind: filters
    from: clinic-router
    to: clinic-router-rules
  front-desk-runs-mail:
    kind: hosts
    from: front-desk-pc
    to: mail-client
    privilege: user
  mail-from-citynet:
    kind: delivers
    from: citynet
    to: receptionist
    description: Fitting requests and wholesaler mail reach the receptionist
  attachments-from-citynet:
    kind: delivers
    from: citynet
    to: mail-client
    description: The same mail carries attachments the client opens
  password-stored:
    kind: stores
    from: front-desk-pc
    to: portal-password
    privilege: user
  receptionist-operates-mail:
    kind: operates
    from: receptionist
    to: mail-client
    description: Deceived, the receptionist opens what they are sent in the mail client
  receptionist-knows-password:
    kind: knows
    from: receptionist
    to: portal-password
  password-authenticates:
    kind: authenticates
    from: portal-password
    to: front-desk-login
  login-authorizes:
    kind: authorizes
    from: front-desk-login
    to: records-portal
  portal-holds-records:
    kind: holds
    from: records-portal
    to: implant-records
    privilege: user
    decrypts: true
    description: The portal serves the records, so it sees plaintext
  front-desk-reads-records:
    kind: accesses
    from: front-desk-login
    to: implant-records
    mode: read
  allow-portal:
    kind: permits
    from: clinic-router-rules
    to: portal-login
    allowed: true

flows:
  portal-login:
    label: Front-desk terminal to the records portal
    source: mail-client
    target: records-portal
    route: [clinic-lan, clinic-router, citynet]
    protocol: tcp/443
    parameters:
      connect:
        status: illustrative
        ttc: "Exponential(mean 0.05)"
        note: "Teaching input: the portal is public"

clusters:
  medichrome-cloud:
    label: MediChrome cloud
    members: [medichrome-host, records-portal, medichrome]
    shown: [records-portal]
    closed: true
  front-desk:
    members: [front-desk-pc, mail-client]
    closed: false
  clinic-router:
    members: [clinic-router, clinic-router-rules]
    closed: true

attacker:
  footholds:
    - {entity: citynet, state: access}
  target: {entity: implant-records, state: read}

scenarios:
  train-receptionist:
    label: Train the receptionist
    changes:
      - {entity: receptionist, defense: trained, value: true}
  require-mfa:
    label: Require multi-factor login on the portal
    changes:
      - {entity: front-desk-login, defense: mfa, value: true}
  guard-mail:
    label: Sandbox mail attachments
    changes:
      - {entity: mail-client, defense: guarded, value: true}
  train-and-mfa:
    label: Train the receptionist and require MFA
    changes:
      - {entity: receptionist, defense: trained, value: true}
      - {entity: front-desk-login, defense: mfa, value: true}

analysis:
  seed: 108
  samples: 10000
  confidence: 0.95
