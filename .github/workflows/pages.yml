name: pages

# Beside the binary release, behind the same gate.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    # As in release.yml: only a commit whose pull request passed ci is
    # deployed. A documentation-only push has no ci run and deploys nothing —
    # the site is the app, so the one already live is still the right one.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: this commit passed ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          echo "successful ci runs for $GITHUB_SHA: $green"
          test "$green" -ge 1

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: pages
      - uses: actions/configure-pages@v5
      - run: scripts/build-wasm.sh --fetch-cli
      # The footer shows the same stamp as the release binary.
      - name: version
        run: |
          base=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "effractor-server") | .version')
          echo "EFFRACTOR_VERSION=$base+$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - run: scripts/build-site.sh
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
