name: release

# Every commit to master is a release.
on:
  push:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    # master takes fast-forward merges only, so this commit is byte for byte
    # the one its pull request tested. Re-running ci.yml would prove nothing
    # new; what is worth proving is that the run exists and was green — a
    # commit pushed straight to master has none, and is not released.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: this commit passed ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          echo "successful ci runs for $GITHUB_SHA: $green"
          test "$green" -ge 1

  wasm:
    # Once, not per architecture: both binaries embed the same bytes.
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      # Also once, here where the toolchain already is: the binaries and the
      # release tag must name the same version.
      - name: version
        id: version
        run: |
          base=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "effractor-server") | .version')
          echo "version=$base+$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-wasm
      - run: scripts/build-wasm.sh --fetch-cli
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-bundle
          path: assets/wasm
          if-no-files-found: error

  build:
    needs: wasm
    strategy:
      matrix:
        include:
          # Native runners for both architectures: no cross toolchain to keep.
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      # Into the embedded folder, before the build that embeds it.
      - uses: actions/download-artifact@v8
        with:
          name: wasm-bundle
          path: assets/wasm
      - run: cargo build --release --locked --target ${{ matrix.target }} -p effractor-server
        env:
          EFFRACTOR_VERSION: ${{ needs.wasm.outputs.version }}
      - name: stage
        env:
          EFFRACTOR_VERSION: ${{ needs.wasm.outputs.version }}
        run: |
          bin=target/${{ matrix.target }}/release/effractor
          # Static, or the installer's promise of "any Linux" is false.
          if ldd "$bin" 2>&1 | grep -q '=>'; then echo "$bin is dynamically linked"; exit 1; fi
          test "$("$bin" --version)" = "effractor $EFFRACTOR_VERSION"
          # The bundle is inside: a binary without it serves a page that cannot solve.
          grep -qa "effractor_wasm_bg" "$bin"
          cp "$bin" effractor-${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: effractor-${{ matrix.target }}
          path: effractor-${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: [wasm, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          # The binaries; the wasm bundle is inside them already.
          pattern: effractor-*
          merge-multiple: true
          path: dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.wasm.outputs.version }}
        run: |
          tag="v$VERSION"
          cd dist
          sha256sum effractor-* > SHA256SUMS
          cat SHA256SUMS
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
            --notes "$(git log -1 --format=%B)" --latest effractor-* SHA256SUMS

  verify:
    # The README's promise, kept honest: a clean machine, the installer, a
    # running instance.
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          docker run --rm -v "$PWD/install.sh:/install.sh:ro" debian:stable-slim sh -euc '
            apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
            sh /install.sh
            "$HOME/.local/bin/effractor" --version
            "$HOME/.local/bin/effractor" --bind 127.0.0.1:8080 &
            sleep 1
            curl -fsS http://127.0.0.1:8080/ | grep -q "<title>effractor</title>"
            curl -fsS -o /dev/null http://127.0.0.1:8080/assets/wasm/effractor_wasm_bg.wasm
            echo "running instance verified"
          '
