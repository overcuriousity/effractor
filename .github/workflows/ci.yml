name: ci

# Pull requests run this directly; the release workflow calls it as its gate,
# so master is tested once per commit, not twice.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A superseded PR run is waste; a superseded release is still a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Toolchain, components and targets come from rust-toolchain.toml.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: wasm build
        run: >
          cargo build --locked --target wasm32-unknown-unknown
          -p effractor-core -p effractor-mal -p effractor-format
          -p effractor-solver -p effractor-wasm

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run vendor:check
      - run: node scripts/check-roadmap.js
      - run: node scripts/check-contrast.js
      - run: shellcheck install.sh scripts/install.test.sh
      - run: sh scripts/install.test.sh
