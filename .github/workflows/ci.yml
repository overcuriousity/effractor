name: ci

# Pull requests run this directly; the release workflow calls it as its gate,
# so master is tested once per commit, not twice.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # One group per pull request, so a new push supersedes the old run — and one
  # per commit when called from the release workflow, so two releases never
  # share a group. They must not: GitHub cancels a *pending* run whenever a
  # newer one joins its group, whatever cancel-in-progress says, and that
  # once cancelled a release's gate.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Toolchain, components and targets come from rust-toolchain.toml.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: wasm build
        run: >
          cargo build --locked --target wasm32-unknown-unknown
          -p effractor-core -p effractor-mal -p effractor-format
          -p effractor-solver -p effractor-wasm

  wasm-determinism:
    # The solver's tests, fingerprints included, run as wasm. They hold the
    # same frozen constants as the native run above, so both passing means
    # native and wasm agree bit for bit.
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir .
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasip1
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - run: cargo test --locked --target wasm32-wasip1 -p effractor-solver

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run vendor:check
      - run: node scripts/check-roadmap.js
      - run: node scripts/check-contrast.js
      - run: shellcheck install.sh scripts/install.test.sh scripts/dev/*.sh
      - run: sh scripts/install.test.sh
