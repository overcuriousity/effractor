name: ci

# Pull requests only. master takes fast-forward merges, so the commit that
# lands is the commit tested here; the release workflow checks that this run
# exists and succeeded instead of repeating it.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Toolchain, components and targets come from rust-toolchain.toml.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Before anything links the server: it embeds assets/, the bundle included,
      # and its tests ask for it.
      - name: wasm bundle
        run: scripts/build-wasm.sh --fetch-cli
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      # The browser module and the native build answer generated graphs alike.
      - name: graph agreement, native and browser wasm
        run: node scripts/check-graph-agreement.js
      - name: static site export
        run: scripts/build-site.sh
      - name: wasm build
        run: >
          cargo build --locked --target wasm32-unknown-unknown
          -p effractor-core -p effractor-mal -p effractor-format -p effractor-components
          -p effractor-solver -p effractor-wasm

  wasm-determinism:
    # The solver's tests, fingerprints included, run as wasm. They hold the
    # same frozen constants as the native run above, so both passing means
    # native and wasm agree bit for bit.
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir .
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasip1
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - run: cargo test --locked --target wasm32-wasip1 -p effractor-solver

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run vendor:check
      - run: node scripts/check-roadmap.js
      - run: node scripts/check-contrast.js
      - run: shellcheck install.sh scripts/*.sh scripts/dev/*.sh
      - run: sh scripts/install.test.sh
